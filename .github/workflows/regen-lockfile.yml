# package-lock.json を CI 上で再生成して同じ branch に push する
# (nuxt-dtako-admin の regen-lockfile.yml と同じ)。
#
# @ippoan/* は GitHub Packages にあり、手元 (NODE_AUTH_TOKEN 無し) では 401 で
# lock を作れないことがある。この workflow を対象 branch で動かすと、registry 解決で
# lock を作り直し、`npm ci` で再現性を検証してから差分を同じ branch に commit / push する。
#
# push には CI_APP_* の app token を使う (GITHUB_TOKEN の push は後続 workflow を
# トリガーしないため、PR の CI が新 commit で再走しなくなる)。
name: regen-lockfile

# workflow_dispatch は default branch に file が乗るまで API から起動できないので、
# feature branch 上でこの workflow ファイル自体の push でも起動する (main は除外)。
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/regen-lockfile.yml']

permissions:
  contents: write
  packages: read

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Create app token (push が CI をトリガーするように)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate package-lock.json (registry 解決)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Guard - lock に container ローカル file 参照が残っていないか
        run: |
          if grep -n 'file:/home/' package-lock.json; then
            echo '::error::package-lock.json に file:/home/ 参照が残っています'
            exit 1
          fi

      - name: Verify - クリーン環境で npm ci が通るか
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --no-audit --no-fund

      - name: Commit & push (差分がある時だけ)
        run: |
          if git diff --quiet -- package-lock.json 2>/dev/null && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json に差分なし — 何もしません'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: package-lock.json を registry 解決で再生成'
          git push origin "HEAD:${GITHUB_REF_NAME}"
