name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: read
  pull-requests: write
  id-token: write       # frontend-ci 内蔵 secret-verify が要求 (ci-workflows#38)

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      # lockfile が古くても manifest に追従して解決する (org caller template 標準)
      install_command: 'npm install'
      post_install_script: 'npx nuxt prepare'
      # wrangler.toml が `[build] command = "npm run build"` を持つので、deploy script に
      # `npm run build` を重ねない (重ねると nuxt build が二重に走る)。
      deploy_staging_script: 'npx wrangler deploy --env staging'
      deploy_release_script: 'npx wrangler deploy'
      # staging deploy を build/upload + 自動 flip の 2 段に分ける (ippoan/ci-workflows#159)
      staging_no_traffic: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # cross-org (ohishi-exp → ippoan/ci-workflows) は secrets: inherit が効かないため明示渡し
      # (Refs ippoan/ci-workflows#125)
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      # deploy-release の traffic-report (v* tag push) が要求
      RELEASE_WAVE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WAVE_WEBHOOK_SECRET }}
      # workflow file を触る PR の auto-merge に要る
      TAG_RELEASE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
